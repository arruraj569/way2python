<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Practice frame · Way2Python</title><link rel="stylesheet" href="assets/style.css"></head><body><main class="standalone-lab" style="padding:20px;min-height:0"><form id="frame-form"><label for="frame-email">Frame email</label><input type="email" id="frame-email" required autocomplete="off"><button class="button primary" id="frame-save" type="submit">Save email</button></form><div class="lab-status" role="status" id="frame-status" aria-live="polite">No email saved</div></main><script>document.getElementById('frame-form').addEventListener('submit',event=>{event.preventDefault();document.getElementById('frame-status').textContent='Saved: '+document.getElementById('frame-email').value;});</script></body></html>
